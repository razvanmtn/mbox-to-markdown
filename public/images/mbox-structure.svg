<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img">
  <title>An mbox file made of messages separated by From lines</title>
  <rect width="760" height="360" rx="28" fill="#f7f3eb"/>
  <text x="40" y="48" fill="#8d4330" font-family="Avenir Next, Segoe UI, sans-serif" font-size="13" letter-spacing="1.6">MAIL.MBOX</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <rect x="40" y="68" width="680" height="78" rx="14" fill="#e9e2d6"/>
    <text x="58" y="98" fill="#8d4330">From ada@example.com Sat Mar 02 09:15:00 2024</text>
    <text x="58" y="124" fill="#221c17">Subject: Hello</text>
    <rect x="40" y="162" width="680" height="78" rx="14" fill="#e9e2d6"/>
    <text x="58" y="192" fill="#8d4330">From grace@example.com Tue Mar 05 14:02:00 2024</text>
    <text x="58" y="218" fill="#221c17">Subject: Notes from Tuesday</text>
    <rect x="40" y="256" width="680" height="78" rx="14" fill="#e9e2d6"/>
    <text x="58" y="286" fill="#8d4330">From invoices@example.com Fri Mar 08 08:40:00 2024</text>
    <text x="58" y="312" fill="#221c17">Subject: March invoice</text>
  </g>
</svg>
